plugins {
    // Gradle plugin portal
    alias(libs.plugins.tripletPlay)
    // TODO: migrate to .kts & replace the next 2 id lines with id("ankidroid.android.app")
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    alias(libs.plugins.androidx.baselineprofile)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.keeper)
    alias(libs.plugins.roborazzi)
    id 'idea'
}

repositories {
    google()
    mavenCentral()
    maven { url = "https://jitpack.io" }
}

keeper {
    traceReferences {
        // Silence missing definitions
        arguments.set(["--map-diagnostics:MissingDefinitionsDiagnostic", "error", "none"])
    }
}

baselineProfile {
    // Write generated profiles to `src/main/baselineProfiles/` instead of the
    // default per-variant `src/playRelease/generated/baselineProfiles/`. This
    // ensures the profile is consumed by ALL variants (play, amazon, full) and
    // ALL buildTypes (release, benchmark), not just `playRelease`.
    mergeIntoMain = true
}

idea {
    module {
        downloadJavadoc = System.getenv("CI") != "true"
        downloadSources = System.getenv("CI") != "true"
    }
}

def homePath = System.properties['user.home']
/**
 * Calculates the current git hash, invalidates configuration cache if changed
 * @example edf739d95bad7b370a6ed4398d46723f8219b3cd
 */
// https://docs.gradle.org/current/userguide/configuration_cache_requirements.html#config_cache:requirements:external_processes
def gitCommitHash = providers.exec {
    commandLine "git", "rev-parse", "HEAD"
}.standardOutput.asText.map { it.trim() }

/**
 * Epoch millis of the build. Displayed on the 'About' screen.
 *
 * CI passes the real time via -PbuildTime=<epoch> # example: 1776422957
 *
 * A local build uses a stale value (captured in the configuration cache) so the configuration cache
 * is not invalidated on every build.
 */
def buildTimeMillis = providers.gradleProperty("buildTime")
    .orElse(providers.provider { System.currentTimeMillis().toString() })

// Usage analytics is a store-build-only capability. The GitHub/F-Droid `full`
// flavor does not compile the transport or carry its credential in BuildConfig.
Properties localBuildProperties = new Properties()
def localPropsFile = project.rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localBuildProperties.load(localPropsFile.newDataInputStream())
}
def analyticsApiKey =
        localBuildProperties.getProperty("ANALYTICS_API_KEY") ?:
                System.getenv("ANALYTICS_API_KEY") ?:
                "DUMMY_API_XXX"

// Release artifacts must always use an explicitly supplied keystore. Keep this validation
// execution-time only so debug builds, unit tests, lint, and Gradle sync need no signing secrets.
def nonBlankEnvironmentValue = { String name ->
    def value = System.getenv(name)
    value == null || value.trim().isEmpty() ? null : value
}
def releaseKeystorePath = nonBlankEnvironmentValue("KEYSTOREPATH")
def releaseKeystorePassword = nonBlankEnvironmentValue("KEYSTOREPWD") ?: nonBlankEnvironmentValue("KSTOREPWD")
def releaseKeyAlias = nonBlankEnvironmentValue("KEYALIAS")
def releaseKeyPassword = nonBlankEnvironmentValue("KEYPWD")
def missingReleaseSigningCredentials = [
        [name: "KEYSTOREPATH", value: releaseKeystorePath],
        [name: "KEYSTOREPWD (or legacy KSTOREPWD)", value: releaseKeystorePassword],
        [name: "KEYALIAS", value: releaseKeyAlias],
        [name: "KEYPWD", value: releaseKeyPassword],
].findAll { it.value == null }.collect { it.name }
def releaseKeystoreFile = releaseKeystorePath == null ? null : file(releaseKeystorePath)

def validateReleaseSigningCredentials = tasks.register("validateReleaseSigningCredentials") {
    group = "verification"
    description = "Fails unless all release signing credentials reference an existing keystore."
    doLast {
        if (!missingReleaseSigningCredentials.isEmpty()) {
            throw new GradleException(
                    "Release signing credentials are missing or empty: ${missingReleaseSigningCredentials.join(', ')}. " +
                            "Set KEYSTOREPATH, KEYSTOREPWD (or legacy KSTOREPWD), KEYALIAS, and KEYPWD; " +
                            "no fallback release keystore is used."
            )
        }
        if (!releaseKeystoreFile.isFile()) {
            throw new GradleException(
                    "Release keystore does not exist or is not a file: ${releaseKeystoreFile}. " +
                            "Set KEYSTOREPATH to an existing keystore file."
            )
        }
    }
}

android {
    namespace = "com.ichi2.anki"

    compileSdk = libs.versions.compileSdk.get().toInteger()

    buildFeatures {
        buildConfig = true
        aidl = true
        viewBinding = true
        resValues = true
        compose = true
    }

    if (rootProject.testReleaseBuild) {
        testBuildType = "release"
    } else {
        testBuildType = "debug"
    }

    defaultConfig {
        applicationId = "io.github.davelewis360.ankidroid.m3expressive"
        buildConfigField "Boolean", "CI", (System.getenv("CI") == "true").toString()
        buildConfigField "String", "ACRA_URL", '"https://ankidroid.org/acra/report"'
        buildConfigField "Boolean", "ENABLE_REMOTE_CRASH_REPORTING", "true"
        buildConfigField "Boolean", "ENABLE_USAGE_ANALYTICS", "true"
        buildConfigField "String", "BACKEND_VERSION", "\"${libs.versions.ankiBackend.get()}\""
        buildConfigField "Boolean", "ENABLE_LEAK_CANARY", "false"
        buildConfigField "String", "GIT_COMMIT_HASH", "\"${gitCommitHash.get()}\""
        buildConfigField "long", "BUILD_TIME", buildTimeMillis.get()
        resValue "string", "app_name", "AnkiDroid M3 Expressive – Unofficial"

        // The version number is of the form:
        // <major>.<minor>.<maintenance>[dev|alpha<build>|beta<build>|]
        // The <build> is only present for alpha and beta releases (e.g., 2.0.4alpha2 or 2.0.4beta4), developer builds do
        // not have a build number (e.g., 2.0.4dev) and official releases only have three components (e.g., 2.0.4).
        //
        // The version code is derived from the version name as follows:
        // AbbCCtDD
        // A: 1-digit decimal number representing the major version
        // bb: 2-digit decimal number representing the minor version
        // CC: 2-digit decimal number representing the maintenance version
        // t: 1-digit decimal number representing the type of the build
        // 0: developer build
        // 1: alpha release
        // 2: beta release
        // 3: public release
        // DD: 2-digit decimal number representing the build
        // 00 for internal builds and public releases
        // alpha/beta build number for alpha/beta releases
        //
        // This ensures the correct ordering between the various types of releases (dev < alpha < beta < release) which is
        // needed for upgrades to be offered correctly.
        versionCode=100101
        versionName="0.1.0-alpha.1"
        minSdk = libs.versions.minSdk.get().toInteger()

        // After #13695: change .tests_emulator.yml
        targetSdk = libs.versions.targetSdk.get().toInteger()
        testApplicationId = "io.github.davelewis360.ankidroid.m3expressive.tests"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner = 'com.ichi2.testutils.NewCollectionPathTestRunner'
    }
    signingConfigs {
        release {
            if (missingReleaseSigningCredentials.isEmpty()) {
                storeFile releaseKeystoreFile
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        named('debug') {
            versionNameSuffix "-debug"
            debuggable true
            applicationIdSuffix ".debug"
            resValue "string", "app_name", "AnkiDroid M3 Expressive Debug"
            splits.abi.universalApk = true // Build universal APK for debug always
            // Check Crash Reports page on developer wiki for info on ACRA testing
            // buildConfigField "String", "ACRA_URL", '"https://918f7f55-f238-436c-b34f-c8b5f1331fe5-bluemix.cloudant.com/acra-ankidroid/_design/acra-storage/_update/report"'
            if (project.rootProject.file('local.properties').exists()) {
                Properties localProperties = new Properties()
                localProperties.load(project.rootProject.file('local.properties').newDataInputStream())
                // #6009 Allow optional disabling of JaCoCo for general build (assembleDebug).
                // jacocoDebug task was slow, hung, and wasn't required unless I wanted coverage
                testCoverageEnabled = localProperties['enable_coverage'] != "false"
                // not profiled: optimization for build times
                if (localProperties['enable_languages'] == "false") {
                    android.defaultConfig.resConfigs "en"
                }
                // allow disabling leak canary
                if (localProperties["enable_leak_canary"] != null) {
                    buildConfigField "Boolean", "ENABLE_LEAK_CANARY", localProperties["enable_leak_canary"]
                } else {
                    buildConfigField "Boolean", "ENABLE_LEAK_CANARY", "true"
                }
            } else {
                testCoverageEnabled true
            }

            // make the icon red if in debug mode
            resValue 'color', 'anki_foreground_icon_color_0', "#FFFF0000"
            resValue 'color', 'anki_foreground_icon_color_1', "#FFFF0000"
        }
        named('release') {
            testCoverageEnabled = testReleaseBuild
            minifyEnabled System.getenv("MINIFY_ENABLED") ? System.getenv("MINIFY_ENABLED") != "false" : true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            testProguardFile 'proguard-test-rules.pro'
            splits.abi.universalApk = universalApkEnabled // Build universal APK for release with `-Duniversal-apk=true`
            signingConfig = signingConfigs.release

            // Expressive release branding; keep the vector geometry unchanged.
            resValue 'color', 'anki_foreground_icon_color_0', "#FF7F67BE"
            resValue 'color', 'anki_foreground_icon_color_1', "#FF00A6A6"
        }

        create('benchmark') {
            initWith release
            applicationIdSuffix ".benchmark"
            resValue "string", "app_name", "AnkiDroid M3 Expressive Benchmark"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
        }

        // The Baseline Profile plugin owns the effective non-minified/profileable settings;
        // declaring its generated build type here customizes only identity and signing.
        create('nonMinifiedRelease') {
            applicationIdSuffix ".baselineprofile"
            resValue "string", "app_name", "AnkiDroid M3 Expressive Baseline Profile"
            signingConfig signingConfigs.debug
        }
    }

    /**
     * Product Flavors are used for Amazon App Store and Google Play Store.
     * This is because we cannot use Camera Permissions in Amazon App Store (for FireTv etc...)
     * Therefore, different AndroidManifest for Camera Permissions is used in Amazon flavor.
     */
    flavorDimensions += "appStore"
    productFlavors {
        create('play') {
            getIsDefault().set(true)
            dimension "appStore"
            buildConfigField "String", "ANALYTICS_API_KEY", "\"${analyticsApiKey}\""
        }
        create('amazon') {
            dimension "appStore"
            buildConfigField "String", "ANALYTICS_API_KEY", "\"${analyticsApiKey}\""
        }
        // A 'full' build has no restrictions on storage/camera. It is the
        // tracker-free FLOSS artifact distributed through GitHub and F-Droid.
        create('full') {
            dimension "appStore"
            buildConfigField "Boolean", "ENABLE_USAGE_ANALYTICS", "false"
            buildConfigField "Boolean", "ENABLE_REMOTE_CRASH_REPORTING", "false"
            buildConfigField "String", "ANALYTICS_API_KEY", '""'
            buildConfigField "String", "ACRA_URL", '""'
        }
    }

    // Share the GA transport only between store flavors. `full` supplies a
    // source-compatible no-op transport and never resolves the GA dependency.
    sourceSets {
        play.kotlin.srcDir 'src/googleAnalytics/java'
        amazon.kotlin.srcDir 'src/googleAnalytics/java'
    }

    /**
     * Set this to true to create five separate APKs instead of one:
     *   - 2 APKs that only work on ARM/ARM64 devices
     *   - 2 APKs that only works on x86/x86_64 devices
     *   - a universal APK that works on all devices
     * The advantage is the size of most APKs is reduced by about 2.5MB.
     * Upload all the APKs to the Play Store and people will download
     * the correct one based on the CPU architecture of their device.
     */
    def enableSeparateBuildPerCPUArchitecture = true

    /**
     * Restricts the build to a single CPU architecture, e.g. `-PabiFilter=arm64-v8a`.
     * Allows F-Droid to build one APK per architecture without patching this file (#21399).
     */
    def abiFilter = providers.gradleProperty("abiFilter").getOrNull()
    def supportedAbis = ["armeabi-v7a", "x86", "arm64-v8a", "x86_64"]
    if (abiFilter != null && !supportedAbis.contains(abiFilter)) {
        throw new GradleException("Unsupported -PabiFilter value '$abiFilter'. Expected one of: $supportedAbis")
    }

    splits {
        abi {
            reset()
            enable = enableSeparateBuildPerCPUArchitecture
            //universalApk enableUniversalApk  // set in debug + release config blocks above
            if (abiFilter != null) {
                include abiFilter
            } else {
                include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
            }
        }
    }
    // applicationVariants are e.g. debug, release
    applicationVariants.configureEach { variant ->
        // We want the same version stream for all ABIs in debug but for release we can split them
        if (variant.buildType.name == 'release') {
            variant.outputs.configureEach { output ->

                // For each separate APK per architecture, set a unique version code as described here:
                // https://developer.android.com/studio/build/configure-apk-splits.html
                def versionCodes = ["armeabi-v7a": 1, "x86": 2, "arm64-v8a": 3, "x86_64": 4]
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith('.apk')) {
                    def abi = output.getFilter("ABI")
                    if (abi != null) {  // null for the universal-debug, universal-release variants
                        //  From: https://developer.android.com/studio/publish/versioning#appversioning
                        //  "Warning: The greatest value Google Play allows for versionCode is 2100000000"
                        //  AnkiDroid versionCodes have a budget 8 digits (through AnkiDroid 9)
                        //  This style does ABI version code ranges with the 9th digit as 0-4.
                        //  This consumes ~20% of the version range space, w/50 years of versioning at our major-version pace
                        output.versionCodeOverride =
                                // ex:  321200106 = 3 * 100000000 + 21200106
                                versionCodes.get(abi) * 100000000 + defaultConfig.versionCode
                    }
                }
            }
        }
    }

    testOptions {
        animationsDisabled = true
        kotlin {
            compilerOptions {
                freeCompilerArgs.add("-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi")
            }
        }
        unitTests {
            all { test ->
                test.useJUnitPlatform {
                    // ./gradlew testFullDebugUnitTest -Pscreenshot
                    if (project.hasProperty("screenshot")) {
                        includeTags "com.ichi2.anki.ScreenshotTestCategory"

                        // ./gradlew :AnkiDroid:recordRoborazziPlayDebug -Pscreenshot -Ptheme=black -Pdevice=tablet,foldable
                        def theme = project.findProperty("theme") ?: "light"
                        def device = project.findProperty("device") ?: "phone"
                        def validateInput = { Object input, List<String> validOptions ->
                            def requested = input.toString().split(',').collect { it.trim().toLowerCase() }
                            def invalid = requested - validOptions
                            if (!invalid.isEmpty()) {
                                throw new GradleException("Invalid param: '${invalid.join(', ')}'. Valid options: ${validOptions.join(', ')}.")
                            }
                        }
                        validateInput(theme, ["light", "plain", "dark", "black", "eink", "all"])
                        validateInput(device, ["phone", "tablet", "foldable", "desktop", "all"])

                        systemProperty "screenshot.theme", theme
                        systemProperty "screenshot.device", device
                    } else {
                        excludeTags "com.ichi2.anki.ScreenshotTestCategory"
                    }
                    // Ensures that no EmptyApplication test relies on AnkiDroidApp
                    //  by only running EmptyApplication tests
                    // ./gradlew testFullDebugUnitTest -PemptyApplication
                    if (project.hasProperty("emptyApplication")) {
                        includeTags "com.ichi2.anki.EmptyApplicationCategory"
                    }
                }
            }
        }
    }

    // https://docs.gradle.org/current/userguide/java_testing.html#sec:java_test_fixtures
    // https://developer.android.com/build/releases/agp-7-2-0-release-notes#test-fixtures
    // ⚠️ There was an in-IDE warning: "Kotlin is not configured" when editing the testFixtures
    // files. I ended up ignoring the warning after the 'Configure' button in Android Studio
    // added dependencies but didn't fix the issue.
    testFixtures {
        enable = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType('nonMinifiedRelease')) { variant ->
        // The plugin clones release sources for this generated target, so attach its safety
        // overlay explicitly instead of relying on conventional build-type source discovery.
        variant.sources.manifests.addStaticManifestFile(
                'src/nonMinifiedRelease/AndroidManifest.xml'
        )
    }
}

def forbiddenReleaseIdentityProperties = ["customSuffix", "customName"].findAll { project.hasProperty(it) }
if (!forbiddenReleaseIdentityProperties.isEmpty()) {
    throw new GradleException(
            "Release identity overrides are not supported: -P${forbiddenReleaseIdentityProperties.join(', -P')}. " +
                    "The canonical application ID and app name are fixed to preserve the API authority contract."
    )
}

// Fast configuration contracts: these run without signing credentials or APK assembly.
def canonicalApplicationId = "io.github.davelewis360.ankidroid.m3expressive"
def canonicalTestApplicationId = "${canonicalApplicationId}.tests"
def configuredApplicationId = android.defaultConfig.applicationId
def configuredTestApplicationId = android.defaultConfig.testApplicationId
def configuredMinSdk = android.defaultConfig.minSdk
def configuredBuildTypeSuffixes = [
        debug: android.buildTypes.getByName("debug").applicationIdSuffix,
        benchmark: android.buildTypes.getByName("benchmark").applicationIdSuffix,
        nonMinifiedRelease: android.buildTypes.getByName("nonMinifiedRelease").applicationIdSuffix,
        release: android.buildTypes.getByName("release").applicationIdSuffix ?: "",
]
def verifyStandaloneIdentity = tasks.register("verifyStandaloneIdentity") {
    group = "verification"
    description = "Verifies the standalone package, test package, API floor, and internal variant suffixes."
    inputs.property("applicationId", configuredApplicationId)
    inputs.property("testApplicationId", configuredTestApplicationId)
    inputs.property("minSdk", configuredMinSdk)
    configuredBuildTypeSuffixes.each { name, suffix ->
        inputs.property("${name}Suffix".toString(), suffix)
    }
    doLast {
        if (configuredApplicationId != canonicalApplicationId) {
            throw new GradleException(
                    "Unexpected applicationId '${configuredApplicationId}'; expected '${canonicalApplicationId}'."
            )
        }
        if (configuredTestApplicationId != canonicalTestApplicationId) {
            throw new GradleException(
                    "Unexpected testApplicationId '${configuredTestApplicationId}'; expected '${canonicalTestApplicationId}'."
            )
        }
        if (configuredMinSdk != 24) {
            throw new GradleException("The supported API floor must remain 24, found ${configuredMinSdk}.")
        }
        [debug: ".debug", benchmark: ".benchmark", nonMinifiedRelease: ".baselineprofile"].each { name, suffix ->
            def actual = configuredBuildTypeSuffixes[name]
            if (actual != suffix) {
                throw new GradleException("Build type '${name}' must use applicationIdSuffix '${suffix}', found '${actual}'.")
            }
        }
        if (!configuredBuildTypeSuffixes.release.isEmpty()) {
            throw new GradleException("Production release must use the canonical applicationId without a suffix.")
        }
    }
}

def prohibitedTrackerCoordinates = ["io.github.criticalay:google-analytics-kt"] as Set
def trackerAllowedConfigurations = ["playImplementation", "amazonImplementation"] as Set
configurations.configureEach { configuration ->
    configuration.dependencies.configureEach { dependency ->
        def coordinate = "${dependency.group}:${dependency.name}"
        if (prohibitedTrackerCoordinates.contains(coordinate) && !trackerAllowedConfigurations.contains(configuration.name)) {
            throw new GradleException(
                    "Tracking dependency '${coordinate}' is not allowed in configuration '${configuration.name}'."
            )
        }
    }
}
def verifyFullFossDependencies = tasks.register("verifyFullFossDependencies") {
    group = "verification"
    description = "Verifies that tracking dependencies are declared only for explicitly allowed store flavors."
    inputs.property("prohibitedTrackerCoordinates", prohibitedTrackerCoordinates.sort().join(","))
    inputs.property("trackerAllowedConfigurations", trackerAllowedConfigurations.sort().join(","))
}

tasks.register("verifyStandaloneApp") {
    group = "verification"
    description = "Runs the standalone identity and tracker-free FLOSS configuration contracts."
    dependsOn(verifyStandaloneIdentity, verifyFullFossDependencies)
}

// Only canonical production artifacts require production credentials. Keeping this exact-name
// allowlist excludes compile, lint, unit-test, and plugin-generated nonMinifiedRelease tasks.
def productionReleaseSigningTasks = [
        "validateSigningPlayRelease", "assemblePlayRelease", "bundlePlayRelease", "packagePlayRelease", "installPlayRelease",
        "validateSigningAmazonRelease", "assembleAmazonRelease", "bundleAmazonRelease", "packageAmazonRelease", "installAmazonRelease",
        "validateSigningFullRelease", "assembleFullRelease", "bundleFullRelease", "packageFullRelease", "installFullRelease",
] as Set
tasks.configureEach { task ->
    if (productionReleaseSigningTasks.contains(task.name)) {
        task.dependsOn(validateReleaseSigningCredentials)
    }
}

play {
    serviceAccountCredentials.set(file("${homePath}/src/AnkiDroid-GCP-Publish-Credentials.json"))
    track.set('alpha')

    // any time we bump minSdk we want Play Store to retain the old artifacts by version code,
    // so that they remain available for older devices
    retain {
        artifacts.set([
                20700300L, // (2.7, minSdk 10, universal APK)
                20804300L, // (2.8.4, minSdk 10, universal APK)
                21004300L, // (2.10.4, minSdk 15, universal APK)
                // release-2.14 minSdk 16: missing and not re-publishable, see issue 17791
                121603300L, // (2.16.3, minSdk 21, ABI armeabi-v7a)
                221603300L, // (2.16.3, minSdk 21, ABI x86)
                321603300L, // (2.16.3, minSdk 21, ABI arm64-v8a)
                421603300L, // (2.16.3, minSdk 21, ABI x86_64)
                121905300L, // (2.19.5, minSdk 23, ABI armeabi-v7a)
                221905300L, // (2.19.5, minSdk 23, ABI x86)
                321905300L, // (2.19.5, minSdk 23, ABI arm64-v8a)
                421905300L, // (2.19.5, minSdk 23, ABI x86_64)
        ])
    }

    // If you retain APKs in a release with different names as we do above,
    // the plugin + Play Store has no idea how to name the release except by date.
    // release name is developer only, but sane names really help, so set one
    releaseName.set(android.defaultConfig.versionName)
}

// Install Git pre-commit hook for Ktlint
// Resolve via git so worktrees (where `.git` is a file) are handled correctly.
def gitHooksDir = providers.exec {
    workingDir = rootProject.rootDir
    commandLine "git", "rev-parse", "--git-path", "hooks"
}.standardOutput.asText.map { rootProject.rootDir.toPath().resolve(it.trim()).toFile() }

tasks.register('installGitHook', Copy) {
    from new File(rootProject.rootDir, 'pre-commit')
    into gitHooksDir
    filePermissions {
        user {
            read = write = execute = true
        }
    }
}
// to run manually: `./gradlew installGitHook`
tasks.named('preBuild').configure { dependsOn('installGitHook') }

// Issue 11078 - some emulators run, but run zero tests, and still report success
tasks.register('assertNonzeroAndroidTests') {
    // Resolve the directory at configuration time, which is Gradle Configuration Cache compatible
    def resultsDir = layout.buildDirectory.dir("outputs/androidTest-results/connected/flavors/play")
    doLast {
        // androidTest currently creates one .xml file per emulator with aggregate results in this dir
        File folder = resultsDir.get().asFile
        File[] listOfFiles = folder.listFiles({ d, f -> f ==~ /.*.xml/ } as FilenameFilter)
        for (File file : listOfFiles) {
            // The aggregate results file currently contains a line with this pattern holding test count
            String[] matches = file.readLines().findAll { it.contains('<testsuite') }
            if (matches.length != 1) {
                throw new GradleScriptException("Unable to determine count of tests executed for " + file.name + ". Regex pattern out of date?", null)
            }
            if (!(matches[0] ==~ /.* tests="\d+" .*/) || matches[0].contains('tests="0"')) {
                throw new GradleScriptException("androidTest executed 0 tests for " + file.name + " - Probably a bug with the emulator. Try another image.", null)
            }
        }
    }
}
afterEvaluate {
    tasks.named("connectedPlay${rootProject.androidTestVariantName}AndroidTest").configure {
        finalizedBy('assertNonzeroAndroidTests')
    }

    // AGP bug: when testFixtures is enabled on an application module, the androidTest R8 task's
    // TESTED_CODE scope only includes the app's dependency artifacts, not the app's own compiled
    // classes. This causes R8 to report "Missing class" errors for all app classes referenced from
    // androidTest code. Work around by adding the app classes as referenced (library) input.
    if (testReleaseBuild) {
        tasks.named("minifyPlayReleaseAndroidTestWithR8").configure {
            referencedClasses.from(
                files("build/intermediates/compile_app_classes_jar/playRelease/bundlePlayReleaseClassesToCompileJar/classes.jar")
            )
        }
    }
}

apply from: "./robolectricDownloader.gradle"
apply from: "./jacoco.gradle.kts"
apply from: "../lint.gradle"

dependencies {
    configurations.configureEach {
        resolutionStrategy {
            // Timber has this as a dependency but they are not up to date. We want to force our version.
            force libs.jetbrains.annotations
        }
    }
    api project(":api")
    implementation libs.androidx.work.runtime
    lintChecks project(":lint-rules")
    coreLibraryDesugaring libs.desugar.jdk.libs.nio

    compileOnly libs.jetbrains.annotations
    compileOnly libs.auto.service.annotations
    annotationProcessor libs.auto.service

    // modules
    implementation project(":anki-common")
    implementation project(":common")
    implementation project(":common:android")
    implementation project(":compat")
    implementation project(":libanki")
    implementation project(":vbpd")
    "baselineProfile" project(":baselineprofile")
    implementation project(":widgets")

    "playImplementation" libs.google.analytics.kt
    "amazonImplementation" libs.google.analytics.kt

    implementation libs.androidx.activity
    // TODO: hoist the Compose enablement (kotlin.compose plugin, buildFeatures.compose,
    // and the dependencies below) into a convention plugin under `buildSrc/` once the
    // Kotlin-DSL migration of this build script lands
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    // Above the BOM's stable material3: see `androidxComposeMaterial3` in the version catalog.
    implementation libs.androidx.compose.material3
    // A strict constraint keeps the pinned alpha even if another dependency asks for a newer
    // material3, which would need a newer compileSdk and AGP than this build uses.
    constraints {
        implementation('androidx.compose.material3:material3') {
            version { strictly libs.versions.androidxComposeMaterial3.get() }
            because 'Material 3 Expressive components; newer alphas need compileSdk 37 and AGP 9.1+'
        }
        implementation('androidx.compose.material3:material3-android') {
            version { strictly libs.versions.androidxComposeMaterial3.get() }
        }
    }
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    debugImplementation libs.androidx.compose.ui.tooling
    // Declares the ComponentActivity that Compose UI tests host their content in (debug builds only)
    debugImplementation libs.androidx.compose.ui.test.manifest
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.browser
    implementation libs.androidx.core.ktx
    implementation libs.androidx.draganddrop
    implementation libs.androidx.exifinterface
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.lifecycle.process
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.profileinstaller
    implementation libs.androidx.recyclerview
    implementation libs.androidx.sqlite.framework
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.viewpager2
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.webkit
    implementation libs.google.material
    implementation libs.android.image.cropper
    implementation libs.nanohttpd
    implementation libs.kotlinx.serialization.json
    implementation libs.seismic

    debugImplementation libs.androidx.fragment.testing.manifest

    // Backend libraries

    implementation libs.protobuf.kotlin.lite // This is required when loading from a file

    // TODO: migrate to `addAnkiBackendDependencies(...)` when this is a gradle.kts file
    Properties localProperties = new Properties()
    if (project.rootProject.file('local.properties').exists()) {
        localProperties.load(project.rootProject.file('local.properties').newDataInputStream())
    }
    if (localProperties['local_backend'] == "true") {
        implementation(files(rootProject.file("../Anki-Android-Backend/rsdroid/build/outputs/aar/rsdroid-release.aar")))
        testImplementation(files(rootProject.file("../Anki-Android-Backend/rsdroid-testing/build/libs/rsdroid-testing.jar")))
    } else {
        implementation libs.ankiBackend.backend
        testImplementation libs.ankiBackend.testing
    }

    // May need a resolution strategy for support libs to our versions
    implementation libs.acra.limiter
    implementation libs.acra.toast
    implementation libs.acra.dialog
    implementation libs.acra.http

    implementation libs.commons.compress
    implementation libs.commons.collections4 // SetUniqueList
    implementation libs.commons.io // FileUtils.contentEquals
    implementation libs.okhttp
    implementation libs.slf4j.timber
    implementation libs.jakewharton.timber
    implementation libs.jsoup
    implementation libs.java.semver // For AnkiDroid JS API Versioning
    implementation libs.drakeet.drawer
    implementation libs.skydoves.colorpickerview
    implementation libs.kotlin.reflect
    implementation libs.kotlin.test
    implementation libs.search.preference

    // Cannot use debugImplementation since classes need to be imported in AnkiDroidApp
    // and there's no no-op version for release build. Usage has been disabled for release
    // build via AnkiDroidApp.
    implementation libs.leakcanary.android

    testImplementation testFixtures(project(":libanki"))
    testImplementation testFixtures(project(":common"))
    testImplementation testFixtures(project(":compat"))
    testImplementation testFixtures(project(":anki-common"))

    // A path for a testing library which provide Parameterized Test
    testImplementation libs.junit.jupiter
    testImplementation libs.junit.jupiter.params
    testImplementation libs.junit.vintage.engine
    testImplementation libs.mockito.inline
    testImplementation libs.mockito.kotlin
    testImplementation libs.hamcrest
    testImplementation libs.test.parameter.injector
    // robolectricDownloader.gradle *may* need a new SDK jar entry if they release one or if we change targetSdk. Instructions in that gradle file.
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.test.junit
    testImplementation libs.kotlin.reflect
    testImplementation libs.kotlin.test
    testImplementation libs.kotlin.test.junit5
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.mockk
    testImplementation libs.androidx.fragment.testing
    // in a JvmTest we need org.json.JSONObject to not be mocked
    testImplementation libs.json
    testImplementation libs.ivanshafran.shared.preferences.mock
    testImplementation libs.androidx.test.runner
    testImplementation libs.androidx.test.rules
    testImplementation libs.androidx.espresso.core
    testImplementation(libs.androidx.espresso.contrib) {
        exclude module: "protobuf-lite"
    }
    testImplementation libs.androidx.work.testing
    testImplementation libs.roborazzi
    testImplementation libs.roborazzi.rule
    testImplementation libs.androidx.compose.ui.test.junit4
    // for testing flows
    testImplementation libs.cashapp.turbine

    // May need a resolution strategy for support libs to our versions
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation(libs.androidx.espresso.contrib) {
        exclude module: "protobuf-lite"
    }
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.uiautomator
    androidTestImplementation libs.kotlin.test
    androidTestImplementation libs.kotlin.test.junit
    androidTestImplementation libs.androidx.fragment.testing

    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.exoplayer.dash
    implementation libs.androidx.media3.ui

    // ---- testFixtures setup ----
    testFixturesImplementation libs.kotlin.stdlib
    testFixturesImplementation libs.jakewharton.timber
    testFixturesImplementation libs.hamcrest
    testFixturesImplementation libs.androidx.test.junit
    // Required so the ExperimentalCoroutinesApi opt-in (applied globally) doesn't cause
    // an "unresolved" warning, which is treated as an error due to allWarningsAsErrors
    testFixturesImplementation libs.kotlinx.coroutines.core
    // The Kotlin Compose Compiler plugin attaches to every Kotlin compilation in the
    // module including testFixtures, which has no @Composable code and refuses to
    // run unless the Compose Runtime is on the classpath. compileOnly satisfies the
    // plugin's version check without shipping the runtime in the testFixtures output.
    testFixturesCompileOnly platform(libs.androidx.compose.bom)
    testFixturesCompileOnly libs.androidx.compose.runtime

}
